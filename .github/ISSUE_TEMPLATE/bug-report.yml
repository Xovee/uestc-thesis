name: 排版问题
description: 报告可复现的编译错误或排版偏差
title: "[Bug] "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已使用最新版本复现问题
          required: true
        - label: 我已搜索现有Issues
          required: true
        - label: 我提供的材料不含个人信息或未公开论文内容
          required: true
  - type: input
    attributes:
      label: 环境
      description: 操作系统、TeX发行版、模板版本和编译引擎
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明实际结果、预期结果和复现步骤
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最小复现示例
      description: 请粘贴可公开的最小TeX示例或提供仓库链接
      render: latex
    validations:
      required: true
  - type: textarea
    attributes:
      label: 编译日志
      description: 请粘贴相关错误和警告，不要上传包含隐私的完整论文
      render: text
